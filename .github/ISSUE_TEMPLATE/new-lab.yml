name: اقتراح اختبار جديد
description: اقتراح مختبر دفاعي مأذون وقابل لإعادة التنفيذ
title: "lab: "
labels:
  - enhancement
body:
  - type: input
    id: objective
    attributes:
      label: الهدف الدفاعي
      placeholder: اختبار وسيلة كشف أو حماية محددة
    validations:
      required: true
  - type: textarea
    id: topology
    attributes:
      label: بيئة المختبر والنطاق
      description: اشرح الأجهزة الافتراضية والعزل والأدوات دون ذكر أهداف حقيقية.
    validations:
      required: true
  - type: textarea
    id: cleanup
    attributes:
      label: خطة الاستعادة وحذف البيانات
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: متطلبات القبول
      options:
        - label: الاختبار مخصص لأجهزة وشبكات مملوكة أو مأذونة.
          required: true
        - label: سيستخدم بيانات اصطناعية ولن يجمع بيانات أشخاص غير مشاركين.
          required: true
        - label: سيشمل وسائل الكشف والحماية وخطوات التنظيف.
          required: true
